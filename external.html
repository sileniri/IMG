<!DOCTYPE html>
<html lang="en">
    <body>
        <script>
            window.addEventListener("message", (message) => {
                if (message.origin) {
                    const data = JSON.parse(message.data);
                    const {userId} = data;
                    if (userId) {
                        localStorage.setItem("userId", userId);
                    }
                }
            });
        </script>
    </body>
</html>
