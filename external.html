<!DOCTYPE html>
<html lang="en">
    <body>
        <script>
            window.addEventListener("message", (message) => {
                if (message.origin) {
                    const data = JSON.parse(message.data);
                    let imageArr = JSON.parse(localStorage.getItem("images")) || [];
                    imageArr.push(data);
                    console.log(imageArr);

                    if (data) {
                        localStorage.setItem("images", imageArr);
                    }
                }
            });
        </script>
    </body>
</html>
